# จำนวนบอทรวมสูงสุดบนเซิร์ฟเวอร์
max-total-bots: 100
# ระยะที่กองทัพเห็นผู้เล่นแล้วเปลี่ยนเป็นโหมดโจมตี
detect-range: 45
# ถ้า false บอทจะไม่โจมตีคนที่ใช้คำสั่ง /bot
target-owner: true
# แจ้งในแชทว่าบอท joined / left the game เหมือนผู้เล่นจริง
broadcast-join-leave: true
# บอทตายแล้วแจ้ง "left the game" ครั้งเดียว (ไม่มีข้อความตายซ้อน) false = ไม่แจ้งตอนตาย
announce-leave-on-death: true
# กันบอทติดสโลว์: ล้าง Slowness และเคลียร์สถานะยกโล่ค้าง
cleanse-slowness: true
# true = ให้บอทโชว์ในแท็บลิสต์เหมือนผู้เล่นออนไลน์
show-in-tablist: false
# เกียร์บอทไม่พัง
unbreakable-gear: true
# บอทตายแล้วดรอปของ (เกราะ/อาวุธ/ของทั้งหมด) true = ดรอป
drop-items: true
# ใยแมงมุม / ลาวา+น้ำ ของบอทชุด UHC (บล็อกทั้งหมดคืนค่าเดิมเองเมื่อหมดเวลา)
traps-enabled: true
trap-web-seconds: 8
trap-lava-seconds: 3
trap-water-seconds: 3
# CPVP: คริสตัลของบอทพังบล็อกไหม (false = ทำดาเมจคนอย่างเดียว แมพไม่พัง)
crystal-block-damage: false
# CPVP: ออบซิเดียนชั่วคราวที่บอทวางรองคริสตัล หายเองกี่วินาที
crystal-obsidian-seconds: 8
# CUTPVP: รถรางระเบิดของบอทพังบล็อกไหม (false = ไม่พังแมพ)
cart-block-damage: false
# CUTPVP: รางที่บอทวาง + รถที่ไม่ระเบิด หายเองกี่วินาที
cart-rail-seconds: 10
# ฟื้นคืนชีพอัตโนมัติ (วินาที) 0 = ไม่ฟื้น
respawn-seconds: 0
# ดาเมจตอนบอทวาร์ปด้วยเอนเดอร์เพิร์ล
pearl-fall-damage: 5.0
# ดาเมจสูงสุดของ mace smash
mace-max-damage: 60.0
# จำนวนคอลัมน์ของแถวทัพ
formation-columns: 5
# รัศมีลาดตระเวนรอบจุดที่เสก
patrol-radius: 25
# รายชื่อผู้เล่นจริงที่ใช้ยืมสกิน (สุ่มต่อบอท) ต้องออนไลน์โหมดถึงจะโหลดสกินได้
skins:
